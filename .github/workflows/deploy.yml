name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_BING_VERIFICATION_CODE: ${{ secrets.PUBLIC_BING_VERIFICATION_CODE }}

      - name: Deploy to Cloudflare Pages
        # Run outside the repository so Astro's Worker config is not auto-detected
        # by the static Pages upload command.
        run: |
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" pages deploy \
            "$GITHUB_WORKSPACE/dist/client" \
            --project-name=amazingplugins-com \
            --cwd="$RUNNER_TEMP"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
