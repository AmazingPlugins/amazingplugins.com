name: Add www custom domain

on:
  workflow_dispatch:

jobs:
  add-www:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: List current Pages domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/amazingplugins-com/domains" \
            > /tmp/domains.json
          python3 <<'PY'
          import json
          d = json.load(open("/tmp/domains.json"))
          print("success", d.get("success"))
          print("errors", d.get("errors"))
          for x in d.get("result") or []:
              print("-", x.get("name"), x.get("status"))
          if not d.get("success"):
              raise SystemExit(1)
          PY

      - name: Add www.amazingplugins.com if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/amazingplugins-com/domains" \
            > /tmp/domains.json
          if python3 -c 'import json; d=json.load(open("/tmp/domains.json")); names={x.get("name") for x in (d.get("result") or [])}; raise SystemExit(0 if "www.amazingplugins.com" in names else 1)'; then
            echo "www.amazingplugins.com already attached"
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"www.amazingplugins.com"}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/amazingplugins-com/domains" \
            > /tmp/add.json
          python3 <<'PY'
          import json
          d = json.load(open("/tmp/add.json"))
          print("success", d.get("success"))
          print("errors", d.get("errors"))
          print("result", d.get("result"))
          if not d.get("success"):
              raise SystemExit(1)
          PY

      - name: Verify HTTPS after attach
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://www.amazingplugins.com/ || true)
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ] || [ "$CODE" = "308" ]; then
              curl -sSI --max-time 20 https://www.amazingplugins.com/ | head -15
              exit 0
            fi
            sleep 15
          done
          echo "www still not healthy yet (DNS/SSL may still be propagating)"
          curl -sSI --max-time 20 https://www.amazingplugins.com/ | head -15 || true
